# s1500d configuration
#
# handler: path to script called on events
# gesture_timeout_ms: how long to wait for additional presses, recommended 100-5000 (default 600)
# log_level: off, error, warn, info, debug, trace (default "info"; RUST_LOG overrides)
# Check this file without the scanner: s1500d --check-config /etc/s1500d/config.toml
# profiles: map press count → profile name passed to handler as "scan <profile>"

gesture_timeout_ms = 600
handler = "/usr/share/s1500d/handler-example.sh"
log_level = "info"

[profiles]
1 = "standard"
2 = "legal"
